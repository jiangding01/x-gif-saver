<!doctype html>
<!--
  Chrome 应用商店小宣传图（440×280）源文件。
  语言用地址参数切换：small-tile.html?lang=en / ?lang=zh
  导出 PNG：node scripts/render-promo.mjs（见 docs/store/LISTING.md「素材」）
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>X GIF Saver promo tile</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 440px;
        height: 280px;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        gap: 28px;
        padding: 0 36px;
        background:
          radial-gradient(260px 200px at 22% 50%, rgb(255 255 255 / 0.1), transparent 70%),
          #0b0d10;
        color: #fff;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .icon {
        flex: none;
        width: 128px;
        height: 128px;
        border-radius: 25px;
        box-shadow:
          0 0 0 1.5px rgb(255 255 255 / 0.22),
          0 12px 32px rgb(0 0 0 / 0.6);
      }
      .text {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .pill {
        align-self: flex-start;
        padding: 3px 10px;
        border-radius: 999px;
        background: linear-gradient(90deg, #ff5f6d, #ffc371);
        color: #111;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      h1 {
        font-size: 32px;
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: -0.01em;
        white-space: nowrap;
      }
      .tagline {
        font-size: 17px;
        font-weight: 600;
        line-height: 1.3;
      }
      .sub {
        font-size: 13px;
        color: rgb(255 255 255 / 0.62);
      }
    </style>
  </head>
  <body>
    <img class="icon" src="../../../public/icons/icon.svg" alt="" />
    <div class="text">
      <span class="pill">MP4 → GIF</span>
      <h1>X GIF Saver</h1>
      <p class="tagline" data-i18n="tagline"></p>
      <p class="sub" data-i18n="sub"></p>
    </div>
    <script>
      const copy = {
        en: { tagline: 'Save GIFs as real .gif files', sub: 'Runs locally · No uploads' },
        zh: { tagline: '一键存成真正的 .gif 文件', sub: '浏览器本地转换 · 不上传数据' },
      };
      const lang = new URLSearchParams(location.search).get('lang') === 'zh' ? 'zh' : 'en';
      document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
      for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = copy[lang][el.dataset.i18n];
    </script>
  </body>
</html>
